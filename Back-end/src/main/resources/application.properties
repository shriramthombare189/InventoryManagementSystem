spring.application.name=Inventory-Management-System

# Database selection: set 'db.engine' to 'h2' or 'sqlite'
db.engine=h2

# H2 (default) - file mode database in ./data/h2db
# Use a simple file URL compatible with H2 2.x; avoid flags that newer H2 versions may not support.
spring.datasource.url=jdbc:h2:file:./data/h2db;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# SQLite option (uncomment to use). To enable sqlite, set db.engine=sqlite and comment H2 above.
#spring.datasource.url=jdbc:sqlite:./data/inventory.db
#spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway migrations (will run on startup)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Server
server.port=8080

# OpenAPI
springdoc.api-docs.path=/api/docs
springdoc.swagger-ui.path=/api/swagger-ui.html

# File upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# Serve static images from the data folder
spring.web.resources.static-locations=file:./data/
